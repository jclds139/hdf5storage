name: unit-tests

on:
  push:
    branches:
      - numpy2
    paths-ignore:
      - 'docs/**'
      - 'MANIFEST.in'
      - 'README.rst'
      - 'THANKS.rst'
      - 'COPYING.txt'
      - '.gitignore'
      - '.gitattributes'

jobs:
  tests:
    strategy:
      matrix:
        os:
          - 'ubuntu-24.04'
          - 'windows-2022'
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
        h5py-version:
          - '>=3.12,<3.13'
          - ''
        numpy-version:
          - '>=2.1,<2.2'
          - ''
        include:
          - os: 'ubuntu-24.04' # There are no NumPy 1.26 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: ''
            numpy-version: '>=1.26,<2.0'
          - os: 'windows-2022' # There are no NumPy 1.26 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: ''
            numpy-version: '>=1.26,<2.0'
          - os: 'ubuntu-24.04' # there are no h5py 3.11 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: '>=3.11,<3.12'
            numpy-version: ''
          - os: 'windows-2022' # there are no h5py 3.11 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: '>=3.11,<3.12'
            numpy-version: ''
          - os: 'ubuntu-24.04' # there are no h5py 3.10 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: '>=3.10,<3.11'
            numpy-version: '<2.0'
          - os: 'windows-2022' # there are no h5py 3.10 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: '>=3.10,<3.11'
            numpy-version: '<2.0'
          - os: 'ubuntu-24.04' # there are no h5py 3.9 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: '>=3.9,<3.10'
            numpy-version: '<2.0'
          - os: 'windows-2022' # there are no h5py 3.9 binaries for Python 3.13
            python-version: '3.11'
            h5py-version: '>=3.9,<3.10'
            numpy-version: '<2.0'
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python dependencies including h5py ${{ matrix.h5py-version }} and NumPy ${{matrix.numpy-version}}
      env:
        H5PY_VERSION: ${{ matrix.h5py-version }}
        NUMPY_VERSION: ${{ matrix.numpy-version}}
      shell: bash
      run: |
        python -m pip install numpy$NUMPY_VERSION h5py$H5PY_VERSION pytest
        python -m pip install .
    - name: Test with pytest
      run: |
        pytest tests

  docs:
    runs-on: 'ubuntu-24.04'
    env:
      PYTHON_VERSION: '3.13'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python $PYTHON_VERSION
        uses: actions/setup-python@v5
        with:
          python-version: $PYTHON_VERSION
      - name: Install Python dependencies
        run: |
          python -m pip install numpy h5py sphinx sphinx-rtd-theme
          python -m pip install .
      - name: Build html docs
        run: |
          cd docs
          make html
